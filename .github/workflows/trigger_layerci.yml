name: Daily Trigger

on:
  workflow_dispatch:
  schedule:
    - cron: "30 2 * * *" # 每天 UTC 02:30（台灣時間 10:30）自動執行

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 簽出原始碼
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安裝 Poetry 與相依套件
        run: |
          pip install poetry
          poetry lock --no-update # 強制讓 lock 檔案同步符合新的 pyproject.toml 內容
          poetry install

      - name: 執行 PTT 自動簽到
        env:
          bot_token: ${{ secrets.BOT_TOKEN }}
          chat_id: ${{ secrets.CHAT_ID }}
          ptt_id_1: ${{ secrets.PTT_ID_1 }}
          ptt_id_2: ${{ secrets.PTT_ID_2 }}
        run: |
          poetry run python main.py
